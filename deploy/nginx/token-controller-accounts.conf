# Optional v0.7 account mode. Replace only the project vhost after local admin setup.
# Do not enable alongside the legacy project template: zone names intentionally match.
# Ubuntu Nginx: include this file inside the existing http{} context, normally
# through sites-enabled. Do not replace nginx.conf or use default_server.
# Replace every models.example.test with the reviewed real domain on the host.
# Unique zone/log names prevent collisions with the other applications.
limit_req_zone $binary_remote_addr zone=token_controller_preview:1m rate=10r/s;
limit_req_zone $server_name zone=token_controller_global:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=token_controller_login:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=token_controller_connections:1m;
# Intentionally omit URI/query string, Authorization, body and referer.
log_format token_controller_minimal '$time_iso8601 $status $request_time';

server {
    listen 80;
    server_name models.example.test;
    if ($host != models.example.test) { return 444; }
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/token-controller-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://models.example.test$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name models.example.test;
    if ($host != models.example.test) { return 444; }
    ssl_certificate /etc/letsencrypt/live/models.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/models.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req zone=token_controller_preview burst=30 nodelay;
    limit_req zone=token_controller_global burst=60 nodelay;
    limit_req_status 429;
    limit_conn token_controller_connections 20;
    limit_conn_status 429;

    access_log /var/log/nginx/token-controller-access.log token_controller_minimal;
    error_log /var/log/nginx/token-controller-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Only this hostname; no includeSubDomains or preload that could affect peers.
    add_header Strict-Transport-Security "max-age=86400" always;

    auth_basic off;
    # Account registration and login are public; approval is enforced by the app.

    proxy_http_version 1.1;
    proxy_set_header Host models.example.test;
    proxy_set_header X-Forwarded-Host models.example.test;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, do not append caller-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /api/local/shutdown {
        auth_basic off;
        return 404;
    }
    location ^~ /api/local/shutdown/ {
        auth_basic off;
        return 404;
    }
    location = /v1 {
        auth_basic off;
        return 503;
    }
    location ^~ /v1/ {
        auth_basic off;
        proxy_read_timeout 660s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18765;
    }
    # /health is public and contains only mode-level metadata; its small
    # mode-only response lets the login page display the correct environment.
    location = /docs {
        auth_basic off;
        return 404;
    }
    location = /openapi.json {
        auth_basic off;
        return 404;
    }
    # Keep all inherited request limits when adding a location-specific limit.
    location ^~ /api/auth/ {
        limit_req zone=token_controller_login burst=8 nodelay;
        limit_req zone=token_controller_preview burst=30 nodelay;
        limit_req zone=token_controller_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:18765;
    }
    location ^~ /api/ {
        # Browser UI uses a host-only session Cookie and CSRF header. Requiring Basic
        # would block self-registration before the application login.
        # API keys are accepted only under /v1/, never as UI credentials.
        auth_basic off;
        proxy_pass http://127.0.0.1:18765;
    }
    location = /api/me {
        auth_basic off;
        # A location with limit_req replaces all server-level limits.
        limit_req zone=token_controller_preview burst=30 nodelay;
        limit_req zone=token_controller_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:18765;
    }
    location / {
        # Keep incidental static-page Authorization out of the application.
        proxy_set_header Authorization "";
        # proxy_set_header inheritance is all-or-nothing: repeat these headers.
        proxy_set_header Host models.example.test;
        proxy_set_header X-Forwarded-Host models.example.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18765;
    }
}

# Temporary HTTP-only certificate bootstrap; DO NOT enable beside the HTTPS
# template for the same server_name. No application content is exposed here.
# Place in /etc/nginx/sites-available/ and enable only this new site.
server {
    listen 80;
    server_name models.example.test;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/token-controller-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

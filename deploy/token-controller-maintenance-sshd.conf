# Additive Match block; validate actual context with sshd -T -C before reload.
# Keep the existing administrator session open. Never replace sshd_config.
Match User tc-maint
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/tc-maint
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    MaxSessions 1
    X11Forwarding no
    ForceCommand /usr/local/lib/token-controller/ssh-dispatch.sh
Match all
